<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Automated Age: AI's Impact on the Workforce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <!-- Use importmap for modern Three.js module loading -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
        }
      }
    </script>
    <style>
        :root {
            --bg-color: #111827; /* Dark Blue-Gray */
            --text-color: #f3f4f6;
            --text-color-light: #9ca3af;
            --card-bg: rgba(31, 41, 55, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --particle-color: #8b5cf6; /* Stored as hex string for color picker */
            --accent-color: #ec4899; /* Pink */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            overflow: hidden; /* Prevent default scrollbars */
            transition: background-color 0.3s, color 0.3s;
        }

        #webgl, #css {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #css {
            pointer-events: none;
            z-index: 1; /* Ensure CSS layer is on top */
        }

        .content-section {
            width: 90vw;
            max-width: 1200px;
            height: 80vh; 
            max-height: 700px;
            box-sizing: border-box; /* Ensure padding is included in width/height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-y: hidden; /* Changed to hidden to prevent double scrollbars */
            pointer-events: none; /* Disabled by default, enabled in JS */
            color: var(--text-color);
            opacity: 0; /* Hidden by default */
            transition: opacity 0.5s ease-in-out;
        }
        
        /* Custom scrollbar for specific containers */
        #impact-visuals-container::-webkit-scrollbar,
        .output-container::-webkit-scrollbar,
        #modal-body::-webkit-scrollbar { 
            width: 8px;
        }
        #impact-visuals-container::-webkit-scrollbar-track,
        .output-container::-webkit-scrollbar-track,
        #modal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        #impact-visuals-container::-webkit-scrollbar-thumb,
        .output-container::-webkit-scrollbar-thumb,
        #modal-body::-webkit-scrollbar-thumb {
            background-color: var(--accent-color);
            border-radius: 20px;
            border: 3px solid transparent;
            background-clip: content-box;
        }
        #impact-visuals-container,
        .output-container,
        #modal-body {
            -ms-overflow-style: none;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color) transparent;
        }


        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-color: rgba(236, 72, 153, 0.5);
        }

        .gradient-text {
            background: linear-gradient(90deg, var(--accent-color), var(--particle-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .section-title {
            font-weight: 900;
            font-size: 2.75rem;
            line-height: 1.2;
            letter-spacing: -0.05em;
        }
        
        .icon-bg { background: rgba(139, 92, 246, 0.1); }
        .text-slate-400 { color: var(--text-color-light); }
        .text-white { color: var(--text-color); }
        .border-gray-700 { border-color: var(--card-border); }

        .impact-bar-container {
            height: 8px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .impact-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease-out;
        }

        /* Controls Panel Styles */
        #controls-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            pointer-events: none; /* Container doesn't block clicks */
        }
        #controls-panel {
            width: 18rem;
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            pointer-events: auto; /* Panel itself is interactive */
            transform-origin: top right;
        }
        #controls-panel.closed {
            transform: scale(0.95) translateX(110%);
            opacity: 0;
            pointer-events: none;
        }
        #toggle-controls-btn {
            position: fixed; /* Fixed position to stay in the corner */
            top: 1rem;
            right: 1rem;
            z-index: 51; /* Above the container */
            pointer-events: auto; /* Button is always interactive */
        }

        #controls-panel input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 8px;
            background: #4a5568; border-radius: 5px; outline: none; opacity: 0.7; transition: opacity .2s;
        }
        #controls-panel input[type="range"]:hover { opacity: 1; }
        #controls-panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
            background: var(--accent-color); cursor: pointer; border-radius: 50%;
        }
        #controls-panel input[type="range"]::-moz-range-thumb {
            width: 20px; height: 20px; background: var(--accent-color);
            cursor: pointer; border-radius: 50%;
        }
        .color-picker-wrapper { display: flex; align-items: center; justify-content: space-between; }
        .color-picker-wrapper input[type="color"] {
             width: 40px; height: 40px; border: none; padding: 0;
             background: none; border-radius: 8px; cursor: pointer;
        }
        
        /* Gemini & Modal Styles */
        #ai-analysis-overlay {
            position: fixed;
            bottom: 5rem; /* Adjusted to make space for nav */
            left: 50%;
            width: 90%;
            max-width: 50rem;
            height: 40vh;
            max-height: 400px;
            z-index: 20;
            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
            opacity: 0;
            transform: translate(-50%, 150%);
            pointer-events: none;
        }
        #ai-analysis-overlay.visible {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
        }

        .gemini-btn {
            background-color: var(--accent-color);
            transition: all 0.2s ease;
        }
        .gemini-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent-color);
        }
        .loader {
            width: 48px; height: 48px; border: 5px solid;
            border-color: var(--accent-color) transparent;
            border-radius: 50%; display: inline-block; box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .output-container {
            border: 1px solid var(--card-border);
            background-color: rgba(0,0,0,0.2);
            min-height: 150px;
            overflow-y: auto;
        }
        .prose-custom {
            color: var(--text-color);
        }
        .prose-custom h3 { font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem; color: var(--accent-color); }
        .prose-custom ul { list-style-position: inside; padding-left: 1rem; }
        .prose-custom li { margin-bottom: 0.5rem; }
        .prose-custom p { margin-bottom: 1rem; line-height: 1.6; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #modal-overlay.visible { opacity: 1; pointer-events: auto; }
        #modal-content {
            width: 90%; max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        #modal-body {
            overflow-y: auto;
            padding-right: 0.5rem; /* For scrollbar spacing */
        }

        /* Navigation Overlay */
        #navigation-overlay {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: auto;
        }
        .nav-btn {
            background-color: var(--card-bg);
            color: var(--text-color-light);
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background-color: var(--accent-color);
            color: white;
            transform: translateY(-5px);
        }
        .nav-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }
        
        /* Styles for the plot overlays */
        .plot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(17, 24, 39, 0.7); /* --bg-color with opacity */
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }
        .plot-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="antialiased">
    <div id="webgl"></div>

    <!-- Controls Panel -->

        <svg id="open-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>

                <button id="plot-close-btn" class="text-slate-400 hover:text-white text-3xl leading-none">&times;</button>

            <div id="plotly-3d-scatter-container" class="w-full h-full flex-grow relative"></div>
        </div>

            </div>
            <div id="plotly-contour-container" class="w-full h-full flex-grow relative"></div>
        </div>
    </div>

        <div class="glass-card w-[90vw] h-[90vh] p-4 flex flex-col">
            <div class="flex justify-between items-center mb-2 flex-shrink-0">

                <button id="funnel-close-btn" class="text-slate-400 hover:text-white text-3xl leading-none">&times;</button>
            </div>
            <div id="plotly-funnel-container" class="w-full h-full flex-grow relative"></div>

    <!-- Navigation Overlay -->

        <div class="flex space-x-2">
            <!-- Navigation buttons will be injected here -->
        </div>

                <h1 class="text-4xl md:text-6xl lg:text-7xl font-black uppercase tracking-tighter leading-tight">
                    The <span class="gradient-text">Automated Age</span>

    <script type="module">
        // --- Import Three.js modules ---
        import * as THREE from 'three';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        // --- Global Setup & Editable Parameters ---
        let camera, scene, renderer, cssRenderer;
        let particlesMesh, tubeMesh;
        let sections = [];
        let currentSection = 0;
        
        let scrollProgress = 0;
        let scrollTarget = 0;
        let curve;
        let mouseX = 0, mouseY = 0;
        let lastPointerTime = Date.now();
        let rotationSpeedMultiplier = 1;
        
        let animationSpeed = 0.07;
        let particleSettings = {
            count: 15000,
            size: 5.5,
        };
        const themes = {
            nebula: { bg: '#111827', text: '#f3f4f6', accent: '#ec4899', particle: '#8b5cf6' },
            solar: { bg: '#000000', text: '#ffffff', accent: '#ff4500', particle: '#ffd700' },
            matrix: { bg: '#0d0208', text: '#00ff41', accent: '#00ff41', particle: '#008F11' },

        function createParticles() {
            if (particlesMesh) scene.remove(particlesMesh);
            const particlesGeometry = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleSettings.count * 3);
            for (let i = 0; i < particleSettings.count * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 10000; 
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particleColor = getComputedStyle(document.documentElement).getPropertyValue('--particle-color').trim();
            const particlesMaterial = new THREE.PointsMaterial({ 
                size: particleSettings.size, 
                color: new THREE.Color(particleColor) 
            });
            particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);
        }

        function createContentSections() {
            const templates = [
                document.getElementById('template-section-0'),
                document.getElementById('template-section-1'),
                document.getElementById('template-section-2'),
                document.getElementById('template-section-3'),
                document.getElementById('template-section-4'),
                document.getElementById('template-section-5'),
                document.getElementById('template-section-6'), // NEW
            ];

            const vFOV = camera.fov * Math.PI / 180;
            const distance = (window.innerHeight / 2) / Math.tan(vFOV / 2);
            
            const numWaypoints = templates.length;
            const helixRadius = 900;
            const zSpacing = 1800;
            const revolutions = 2.0; // Increased revolutions for more spiral

            waypoints = [];
            for (let i = 0; i < numWaypoints; i++) {
                const t = i / (numWaypoints - 1);
                const angle = t * (Math.PI * 2 * revolutions);
                const x = i === 0 ? 0 : helixRadius * Math.cos(angle - Math.PI / 2);
                const y = i === 0 ? 0 : 600 * Math.sin(t * Math.PI); 
                const z = i * -zSpacing + distance;
                const rotation = new THREE.Euler(0, -angle, 0);
                waypoints.push({ position: new THREE.Vector3(x, y, z), rotation: rotation });
            }

            templates.forEach((template, i) => {
                const element = document.createElement('div');
                element.className = 'content-section';
                element.innerHTML = template.innerHTML;
                
                const object = new CSS3DObject(element);
                const waypointPosition = waypoints[i].position.clone();
                const forward = new THREE.Vector3(0, 0, -1).applyEuler(waypoints[i].rotation);
                waypointPosition.add(forward.multiplyScalar(-distance));
                object.position.copy(waypointPosition);
                object.rotation.copy(waypoints[i].rotation);
                scene.add(object);
                sections.push(object);

                if (i === 3) setupImpactVisuals(element, 'impact-visuals-container');
            });
        }
        
        function createCameraPath() {
            if (tubeMesh) scene.remove(tubeMesh);
            const tubePoints = waypoints.map(wp => wp.position.clone());

                color: new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim()),

                opacity: 0.2,

            });
            tubeMesh = new THREE.Mesh(tubeGeometry, tubeMaterial);
            scene.add(tubeMesh);
        }

        function setupContourPlot() {
            const container = document.getElementById('plotly-contour-container');
            if (!container || !jobImpactData || jobImpactData.length === 0) return;

            container.innerHTML = '';

            const xData = jobImpactData.map(d => d.Tasks);
            const yData = jobImpactData.map(d => d['AI models']);
            const zData = jobImpactData.map(d => parseInt(d['AI Impact']));

            const numBins = 20;

            const xMin = Math.min(...xData);
            const xMax = Math.max(...xData);
            const yMin = Math.min(...yData);
            const yMax = Math.max(...yData);

            const xBinSize = (xMax - xMin) / numBins;
            const yBinSize = (yMax - yMin) / numBins;

            const xGrid = Array.from({ length: numBins }, (_, i) => xMin + xBinSize * (i + 0.5));
            const yGrid = Array.from({ length: numBins }, (_, i) => yMin + yBinSize * (i + 0.5));
            
            const zSums = Array.from({ length: numBins }, () => Array(numBins).fill(0));
            const counts = Array.from({ length: numBins }, () => Array(numBins).fill(0));

            for (let i = 0; i < jobImpactData.length; i++) {
                const xIndex = Math.max(0, Math.min(numBins - 1, Math.floor((xData[i] - xMin) / xBinSize)));
                const yIndex = Math.max(0, Math.min(numBins - 1, Math.floor((yData[i] - yMin) / yBinSize)));
                
                if (!isNaN(xIndex) && !isNaN(yIndex)) {
                   zSums[yIndex][xIndex] += zData[i];
                   counts[yIndex][xIndex]++;
                }
            }

            const zGrid = Array.from({ length: numBins }, (_, y) =>
                Array.from({ length: numBins }, (_, x) =>
                    counts[y][x] > 0 ? zSums[y][x] / counts[y][x] : null
                )
            );

            const trace = {
                x: xGrid,
                y: yGrid,
                z: zGrid,
                type: 'contour',
                colorscale: 'Electric',
                connectgaps: false,
                contours: {
                    coloring: 'heatmap'
                },
                colorbar: {
                    title: 'Avg. AI Impact %',
                    titlefont: { color: 'white' },
                    tickfont: { color: 'white' }
                }
            };

            const layout = {
                margin: { l: 60, r: 20, b: 50, t: 20 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: 'white', family: 'Inter, sans-serif' },
                xaxis: { title: 'Task Complexity', color: 'white', gridcolor: 'rgba(255,255,255,0.1)' },
                yaxis: { title: 'AI Tooling', color: 'white', gridcolor: 'rgba(255,255,255,0.1)' }
            };

            Plotly.newPlot(container, [trace], layout, {responsive: true});
        }

        async function callGemini(prompt, outputElement) {
            outputElement.innerHTML = '<div class="flex justify-center items-center h-full"><div class="loader"></div></div>';
            let chatHistory = [{ role: "user", parts: [{ text: prompt }] }];
            const payload = { contents: chatHistory };
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.candidates && result.candidates.length > 0) {
                    const text = result.candidates[0].content.parts[0].text;
                    let html = text.replace(/### (.*)/g, '<h3>$1</h3>').replace(/## (.*)/g, '<h2>$1</h2>').replace(/\* \*(.*)\*\*/g, '<strong>$1</strong>').replace(/\*(.*)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
                    outputElement.innerHTML = html;
                } else {
                    outputElement.innerHTML = '<p class="text-red-400">Sorry, something went wrong.</p>';
                }
            } catch (error) {
                console.error("Error calling Gemini API:", error);
                outputElement.innerHTML = '<p class="text-red-400">Failed to connect to the AI service.</p>';
            }
        }

        function updateSectionVisibility() {
            const newSection = Math.round(scrollProgress * (waypoints.length - 1));
            
            if (newSection !== currentSection) {
                currentSection = newSection;
                sections.forEach((section, index) => {
                    const isCurrent = index === currentSection;
                    section.element.style.opacity = isCurrent ? '1' : '0';
                    section.element.style.pointerEvents = isCurrent ? 'auto' : 'none';
                });
                document.querySelectorAll('.nav-btn').forEach((btn, index) => {
                    btn.classList.toggle('active', index === currentSection);
                });
                document.getElementById('ai-analysis-overlay').classList.toggle('visible', currentSection === 3);
            }
            
            const plotOverlay = document.getElementById('plot-overlay');
            const isPlotSection = currentSection === 4;
            if (isPlotSection && !plotOverlay.classList.contains('visible')) {
                plotOverlay.classList.add('visible');
                setTimeout(setup3dPlot, 50); 
            } else if (!isPlotSection && plotOverlay.classList.contains('visible')) {

        function animate() {
            requestAnimationFrame(animate);
            
            scrollProgress = THREE.MathUtils.lerp(scrollProgress, scrollTarget, animationSpeed);

            curve.getPointAt(scrollProgress, camera.position);

            const segmentProgress = scrollProgress * (waypoints.length - 1);
            const fromIndex = Math.floor(segmentProgress);
            const toIndex = Math.min(fromIndex + 1, waypoints.length - 1);
            const sectionLerp = segmentProgress - fromIndex;

            const fromSection = sections[fromIndex].position;
            const toSection = sections[toIndex].position;
            const lookAtTarget = fromSection.clone().lerp(toSection, sectionLerp);
            camera.lookAt(lookAtTarget);

            sections.forEach(section => {
                section.lookAt(camera.position);
            });

            updateSectionVisibility();
            
            if (Date.now() - lastPointerTime > 200) {
                rotationSpeedMultiplier = Math.max(0.01, rotationSpeedMultiplier * 0.98); 
            } else {
                rotationSpeedMultiplier = 1;
            }

            if (particlesMesh) {
                const targetRotX = -mouseY * 0.00005;
                const targetRotY = mouseX * 0.00005;
                particlesMesh.rotation.x += (targetRotX - particlesMesh.rotation.x) * 0.02 * rotationSpeedMultiplier;
                particlesMesh.rotation.y += (targetRotY - particlesMesh.rotation.y) * 0.02 * rotationSpeedMultiplier;
            }

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }

    </script>
</body>
